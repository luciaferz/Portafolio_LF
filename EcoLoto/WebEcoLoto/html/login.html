<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoLoto - Inicio de sesión</title>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body class="page-shell">
    <header class="app-header">
      <div class="container app-header-inner">
        <a class="brand-link" href="../../index.html">
          <img src="../assets/log-contrast.png" alt="" class="brand-mark" />
          <span>EcoLoto</span>
        </a>
        <nav class="header-nav" aria-label="Navegación de acceso">
          <a class="active" href="login.html">Iniciar sesión</a>
          <a href="registro.html">Crear cuenta</a>
        </nav>
      </div>
    </header>
    <main class="container">
      <section class="hero">
        <h1 class="auth-page-title auth-page-title-soft">Inicio de sesión</h1>
        <p class="muted">Introduce tus credenciales para acceder a tu panel.</p>
      </section>

      <form id="loginForm">
        <label for="dni">DNI</label>
        <input id="dni" name="dni" required autocomplete="username" />

        <label for="password">Contraseña</label>
        <input id="password" type="password" name="password" required autocomplete="current-password" />

        <p id="loginError" class="error"></p>
        <div class="btn-row">
          <button class="btn" type="submit">Iniciar sesión</button>
          <a class="btn secondary" href="recuperar.html">¿Olvidaste tu contraseña?</a>
        </div>
      </form>
    </main>
    <footer class="site-footer">
      <div class="container footer-content">
        <p>EcoLoto © 2026 · Participación ciudadana para un reciclaje responsable.</p>
        <div class="footer-logos" aria-label="Participantes actuales">
          <img src="../assets/Ayuntamiento Madrid.png" alt="Ayuntamiento de Madrid" class="footer-logo-img" />
          <img src="../assets/Ayuntamiento coslada.png" alt="Ayuntamiento de Coslada" class="footer-logo-img" />
        </div>
        <a class="btn footer-sponsor-btn" href="mailto:patrocinios@ecoloto.local?subject=Quiero%20participar%20como%20patrocinador">Participa como patrocinador</a>
      </div>
    </footer>
    <script src="../js/app.js"></script>
  </body>
</html>
