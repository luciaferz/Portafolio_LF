<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoLoto - Configuración</title>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body data-secure="true" class="page-shell">
    <div class="layout">
      <aside class="sidebar" id="sideMenu">
        <div class="sidebar-brand">
          <img src="../assets/log-contrast.png" alt="Logo EcoLoto" class="sidebar-logo" />
          <h2>EcoLoto</h2>
        </div>
        <p class="small">Usuario: <strong id="topUser">-</strong></p>
        <ul class="menu">
          <li><a href="panel.html">Inicio</a></li>
          <li><a href="sorteos.html">Sorteos</a></li>
          <li><a href="bolsas.html">Bolsas</a></li>
          <li><a href="solicitudes.html">Etiquetas</a></li>
          <li><a href="perfil.html">Perfil</a></li>
          <li><a href="configuracion.html" class="active">Configuraci&oacute;n</a></li>
          <li><a href="notificaciones.html">Notificaciones</a></li>
        </ul>
        <button id="logoutBtn" class="logout-btn" type="button">Cerrar sesión</button>
        <button
          id="menuToggle"
          class="menu-toggle sidebar-handle"
          type="button"
          aria-controls="sideMenu"
          aria-expanded="true"
          aria-label="Abrir o cerrar menú lateral"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
      </aside>

      <main class="main">
        <div class="topbar">
          <div class="topbar-brand">
            <a class="brand-link" href="panel.html">
              <img src="../assets/log-contrast.png" alt="" class="brand-mark" />
              <span>EcoLoto</span>
            </a>
            <strong class="topbar-title">Configuración</strong>
          </div>
          <span class="badge">Participación: <span id="topParticipation">-</span></span>
        </div>

        <form id="settingsForm">
          <label for="theme">Color de tema</label>
          <select id="theme" name="theme">
            <option value="light">Blanco</option>
            <option value="dark">Negro</option>
          </select>

          <label for="fontSize">Tamaño de letra</label>
          <select id="fontSize" name="fontSize">
            <option value="13">Pequeña</option>
            <option value="16">Media</option>
            <option value="20">Grande</option>
          </select>

          <label for="language">Idioma</label>
          <select id="language" name="language">
            <option value="es">Español</option>
            <option value="en">English</option>
          </select>

          <button class="btn" type="submit">Guardar configuración</button>
          <p id="settingsOk" class="small"></p>
        </form>
      </main>
    </div>
    <footer class="site-footer">
      <div class="container footer-content">
        <p>EcoLoto © 2026 · Participación ciudadana para un reciclaje responsable.</p>
        <div class="footer-logos" aria-label="Participantes actuales">
          <img src="../assets/Ayuntamiento Madrid.png" alt="Ayuntamiento de Madrid" class="footer-logo-img" />
          <img src="../assets/Ayuntamiento coslada.png" alt="Ayuntamiento de Coslada" class="footer-logo-img" />
        </div>
        <a class="btn footer-sponsor-btn" href="mailto:patrocinios@ecoloto.local?subject=Quiero%20participar%20como%20patrocinador">Participa como patrocinador</a>
      </div>
    </footer>
    <script src="../js/app.js"></script>
  </body>
</html>
