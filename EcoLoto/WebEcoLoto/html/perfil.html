<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoLoto - Perfil</title>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body data-secure="true" class="page-shell">
    <div class="layout">
      <aside class="sidebar" id="sideMenu">
        <div class="sidebar-brand">
          <img src="../assets/log-contrast.png" alt="Logo EcoLoto" class="sidebar-logo" />
          <h2>EcoLoto</h2>
        </div>
        <p class="small">Usuario: <strong id="topUser">-</strong></p>
        <ul class="menu">
          <li><a href="panel.html">Inicio</a></li>
          <li><a href="sorteos.html">Sorteos</a></li>
          <li><a href="bolsas.html">Bolsas</a></li>
          <li><a href="solicitudes.html">Etiquetas</a></li>
          <li><a href="perfil.html" class="active">Perfil</a></li>
          <li><a href="configuracion.html">Configuraci&oacute;n</a></li>
          <li><a href="notificaciones.html">Notificaciones</a></li>
        </ul>
        <button id="logoutBtn" class="logout-btn" type="button">Cerrar sesión</button>
        <button
          id="menuToggle"
          class="menu-toggle sidebar-handle"
          type="button"
          aria-controls="sideMenu"
          aria-expanded="true"
          aria-label="Abrir o cerrar menú lateral"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
      </aside>

      <main class="main">
        <div class="topbar">
          <div class="topbar-brand">
            <a class="brand-link" href="panel.html">
              <img src="../assets/log-contrast.png" alt="" class="brand-mark" />
              <span>EcoLoto</span>
            </a>
            <strong class="topbar-title">Perfil de usuario</strong>
          </div>
          <span class="badge">Participaci&oacute;n: <span id="topParticipation">-</span></span>
        </div>

        <form id="perfilForm">
          <fieldset>
            <legend>Datos</legend>
            <label for="dni">DNI (no editable)</label>
            <input id="dni" name="dni" readonly />

            <label for="firstName">Nombre</label>
            <input id="firstName" name="firstName" required autocomplete="given-name" />

            <label for="lastName">Apellidos</label>
            <input id="lastName" name="lastName" required autocomplete="family-name" />

            <label for="phone">Teléfono</label>
            <input id="phone" name="phone" inputmode="tel" autocomplete="tel" />

            <label for="email">Correo</label>
            <input id="email" name="email" type="email" autocomplete="email" />
          </fieldset>

          <fieldset>
            <legend>Domicilio</legend>
            <label for="roadType">Tipo de vía</label>
            <select id="roadType" name="roadType" required>
              <option value="" disabled selected>Selecciona un tipo de vía</option>
              <option value="Calle">Calle</option>
              <option value="Avenida">Avenida</option>
              <option value="Plaza">Plaza</option>
              <option value="Paseo">Paseo</option>
              <option value="Camino">Camino</option>
              <option value="Carretera">Carretera</option>
              <option value="Ronda">Ronda</option>
              <option value="Travesia">Travesía</option>
            </select>

            <label for="roadName">Nombre de vía</label>
            <input id="roadName" name="roadName" required autocomplete="address-line1" />

            <label for="number">Número</label>
            <input id="number" name="number" required inputmode="numeric" />

            <label for="floor">Piso</label>
            <input id="floor" name="floor" autocomplete="address-line2" />

            <label for="autonomousCommunity">Comunidad autónoma</label>
            <select id="autonomousCommunity" name="autonomousCommunity" required></select>

            <label for="locality">Localidad</label>
            <select id="locality" name="locality" required></select>

            <label for="postalCode">Código postal</label>
            <input id="postalCode" name="postalCode" required inputmode="numeric" autocomplete="postal-code" />
          </fieldset>

          <button class="btn" type="submit">Guardar cambios</button>
          <p id="perfilOk" class="small"></p>
        </form>

      </main>
    </div>
    <footer class="site-footer">
      <div class="container footer-content">
        <p>EcoLoto © 2026 · Participación ciudadana para un reciclaje responsable.</p>
        <div class="footer-logos" aria-label="Participantes actuales">
          <img src="../assets/Ayuntamiento Madrid.png" alt="Ayuntamiento de Madrid" class="footer-logo-img" />
          <img src="../assets/Ayuntamiento coslada.png" alt="Ayuntamiento de Coslada" class="footer-logo-img" />
        </div>
        <a class="btn footer-sponsor-btn" href="mailto:patrocinios@ecoloto.local?subject=Quiero%20participar%20como%20patrocinador">Participa como patrocinador</a>
      </div>
    </footer>
    <script src="../js/app.js"></script>
  </body>
</html>
